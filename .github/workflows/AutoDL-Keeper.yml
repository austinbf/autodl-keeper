name: AutoDL Keeper

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 仅检查实例和保活条件
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: autodl-keeper
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: 检查并保活
        env:
          AUTHORIZATION: ${{ secrets.AUTHORIZATION }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            python -u keeper_actions.py --check-only
          else
            python -u keeper_actions.py
          fi
